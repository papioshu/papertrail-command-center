[package]
name = "papertrail-command-center"
version = "0.1.0"
edition = "2021"
description = "PAPERTRAIL // COMMAND CENTER"

[lib]
name = "ptcc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
# Same versions Tauri already links; used only to lower WebView2 memory while hidden.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
