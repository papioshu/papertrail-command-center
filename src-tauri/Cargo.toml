[package]
name = "papertrail-command-center"
version = "0.1.0"
edition = "2021"
description = "PAPERTRAIL // COMMAND CENTER"
license = "MIT"

[lib]
name = "ptcc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Already compiled in through Tauri; used for team PIN hashes (D019).
sha2 = "0.10"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
# Phone access (D027): small sync HTTP server + QR code for pairing.
tiny_http = "0.12"
qrcodegen = "1.8"
# Already linked via tauri-plugin-autostart; registers the phone standby at login (D029).
auto-launch = "0.6"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri already links; used only to lower WebView2 memory while hidden.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

# Tests only: a real hub on loopback for the hub client (never linked into the app).
[dev-dependencies]
ptcc-hub = { path = "../hub" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
